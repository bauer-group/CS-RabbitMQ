# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (all ecosystems)
# =============================================================================
# No paths: filter - every Dependabot PR reaches the module and gets an
# explicit decision and annotation instead of silently staying open. It is
# merged only after docker-release.yml ran on its head commit and passed:
#   - docker  src/*/Dockerfile           -> the PR run builds both images
#   - pip     src/rabbitmq-init/requirements*.txt
#                                        -> the PR run installs them, runs
#                                           pytest and builds rabbitmq-init
#   - docker-compose: the compose files reference images only via
#     ${VAR:-...}:${VAR:-latest}, which Dependabot cannot update
#   - github-actions and any other .github/ change stay open (manual merge)
# Patch and minor updates are merged once the required PR CI passed; majors
# stay manual (module default for merge-update-types).
# The merge is made with the GITHUB_TOKEN, which starts no push workflow, so
# after a merge this workflow dispatches docker-release.yml on main
# (release-workflow) and waits for it; a release run that does not succeed
# turns this job red. That run tests and builds the merged commit again,
# releases exactly that commit (fix(docker) / fix(deps) -> PATCH) and pushes
# the images only if it released.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites
  statuses: read        # commit statuses
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # tests rabbitmq-init and builds the images.
      required-workflows: '.github/workflows/docker-release.yml'
      # A merge made with the GITHUB_TOKEN starts no push workflow: dispatch
      # the release on main after a merge and fail this job if it does not
      # succeed (release-wait-minutes, default 60).
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
